<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="c1-cyan" x1="12" y1="36" x2="42" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c1-amber" x1="68" y1="36" x2="38" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB24A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="c1-spark" x1="36" y1="12" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="c1-orbit" x1="16" y1="58" x2="64" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#FF9A32"/>
    </linearGradient>
    <linearGradient id="c1-text-gradient" x1="90" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON (80x80 box centered at left) -->
  <g transform="translate(4, 4)">
    <!-- Ambient Glow behind mark -->
    <circle cx="40" cy="38" r="26" fill="#00F2FE" opacity="0.12" filter="url(#c1-glow)"/>
    <!-- Orbit Track -->
    <path d="M16 34C19 21 28 12 40 9" stroke="url(#c1-orbit)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M60 20C63.5 24.5 65 30 65 36" stroke="url(#c1-orbit)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Left Page (Cyan) -->
    <path d="M11 44C19 38 28 39 39 45.5v19.5c-10-6-19-6.5-28-.8V44Z" fill="url(#c1-cyan)"/>
    <!-- Right Page (Amber) -->
    <path d="M69 44C61 38 52 39 41 45.5v19.5c10-6 19-6.5 28-.8V44Z" fill="url(#c1-amber)"/>
    <!-- Center Spine Spine highlight -->
    <path d="M11 44C19 38 28 39 39 45.5c10-6.5 19-7.5 30-1.5v20.2c-10-6-19-5.5-29 .5-10-6-19-6.5-29-.7V44Z" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M40 45v19" stroke="#0B0F19" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Central AI Star / Spark -->
    <path d="M40 13c2.2 6.2 4.4 9.2 8.5 12-4.1 2-6.3 5-8.5 10.5-2.2-5.5-4.4-8.5-8.5-10.5 4.1-2.8 6.3-5.8 8.5-12Z" fill="url(#c1-spark)" filter="url(#c1-glow)"/>
    <circle cx="53" cy="15" r="2.5" fill="#00F2FE"/>
  </g>

  <!-- WORDMARK: SIKHUN.COM -->
  <g transform="translate(92, 0)">
    <text x="0" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="url(#c1-text-gradient)">
      Sikhun<tspan fill="#F97316">.</tspan><tspan fill="#00F2FE" font-size="28" font-weight="700">com</tspan>
    </text>
    <!-- Tagline Badge -->
    <rect x="0" y="55" width="168" height="18" rx="4" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.25" stroke-width="1"/>
    <text x="7" y="67" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#38BDF8" text-transform="uppercase">
      AI STUDY PLATFORM
    </text>
  </g>
</svg>
