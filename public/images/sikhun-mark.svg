<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
    <defs>
        <linearGradient id="sikhun-cyan-page" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d2ff" />
            <stop offset="100%" stop-color="#0084d1" />
        </linearGradient>
        <linearGradient id="sikhun-orange-page" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff9e00" />
            <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>
        <linearGradient id="sikhun-star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
    </defs>

    <!-- AI Star & Diamond Neural Network -->
    <g stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="60" y1="56" x2="60" y2="28" />
        <line x1="60" y1="56" x2="38" y2="40" />
        <line x1="60" y1="56" x2="82" y2="40" />
        <line x1="38" y1="40" x2="60" y2="20" />
        <line x1="82" y1="40" x2="60" y2="20" />
    </g>

    <!-- AI Nodes -->
    <circle cx="60" cy="56" r="3.6" fill="#0f172a" />
    <circle cx="38" cy="40" r="4.2" fill="#00d2ff" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="82" cy="40" r="4.2" fill="#ff9e00" stroke="#ffffff" stroke-width="1.2" />

    <!-- Radiant 4-pointed Knowledge Star -->
    <path d="M60 4 C60 16 64 20 76 20 C64 20 60 24 60 36 C60 24 56 20 44 20 C56 20 60 16 60 4 Z" fill="url(#sikhun-star-gold)" />

    <!-- Book Left Page (Cyan) -->
    <path d="M59 74 C44 65 30 63 12 66 C11.5 66.1 11 66.6 11 67.2 L11 96 C11 96.6 11.5 97.1 12 97 C30 94 44 96 59 104 Z" fill="url(#sikhun-cyan-page)" />
    <!-- Book Right Page (Orange) -->
    <path d="M61 74 C76 65 90 63 108 66 C108.5 66.1 109 66.6 109 67.2 L109 96 C109 96.6 108.5 97.1 108 97 C90 94 76 96 61 104 Z" fill="url(#sikhun-orange-page)" />

    <!-- Dual Underlines -->
    <rect x="18" y="106" width="36" height="4" rx="2" fill="#00b4d8" />
    <rect x="66" y="106" width="36" height="4" rx="2" fill="#f77f00" />
</svg>
