<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" fill="none">
  <defs>
    <linearGradient id="c2b-stroke" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="c2b-amber" x1="45" y1="20" x2="65" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="c2b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(6, 6)">
    <circle cx="34" cy="34" r="30" fill="#6366F1" opacity="0.15" filter="url(#c2b-glow)"/>
    <circle cx="34" cy="34" r="32" stroke="#6366F1" stroke-opacity="0.25" stroke-dasharray="3 3"/>
    <path d="M14 42C12 28 20 14 36 12C46 11 54 16 57 24" stroke="url(#c2b-stroke)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M22 52V30C22 25 26 21 31 21C36 21 40 25 40 30V52" stroke="url(#c2b-stroke)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 38H49C54 38 57 42 57 47V52" stroke="url(#c2b-stroke)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 21H45" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="57" cy="22" r="5" fill="url(#c2b-amber)" filter="url(#c2b-glow)"/>
    <circle cx="57" cy="22" r="2" fill="#FFFFFF"/>
    <path d="M57 14V17M57 27V30M49 22H52M62 22H65" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- WORDMARK: শিখুন -->
  <g transform="translate(94, 0)">
    <text x="0" y="47" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">
      শিখুন<tspan fill="#6366F1">.</tspan><tspan fill="#EC4899" font-size="28" font-weight="700">কম</tspan>
    </text>
    <rect x="0" y="55" width="195" height="19" rx="4" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
    <text x="8" y="68" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="11" font-weight="600" fill="#C7D2FE">
      বাংলাদেশের স্মার্ট লার্নিং হাব
    </text>
  </g>
</svg>
