<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" fill="none">
  <defs>
    <linearGradient id="c1b-cyan" x1="12" y1="36" x2="42" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c1b-amber" x1="68" y1="36" x2="38" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB24A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="c1b-spark" x1="36" y1="12" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="c1b-orbit" x1="16" y1="58" x2="64" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#FF9A32"/>
    </linearGradient>
    <filter id="c1b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(4, 4)">
    <circle cx="40" cy="38" r="26" fill="#00F2FE" opacity="0.12" filter="url(#c1b-glow)"/>
