    <rect x="0" y="55" width="200" height="19" rx="4" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
    <text x="8" y="68" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="11" font-weight="600" fill="#FDE047">
      ভর্তি ও একাডেমিক সফলতার সঙ্গী
