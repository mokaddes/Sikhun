    <path d="M60 20C63.5 24.5 65 30 65 36" stroke="url(#c1b-orbit)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M11 44C19 38 28 39 39 45.5v19.5c-10-6-19-6.5-28-.8V44Z" fill="url(#c1b-cyan)"/>
    <path d="M69 44C61 38 52 39 41 45.5v19.5c10-6 19-6.5 28-.8V44Z" fill="url(#c1b-amber)"/>
    <path d="M11 44C19 38 28 39 39 45.5c10-6.5 19-7.5 30-1.5v20.2c-10-6-19-5.5-29 .5-10-6-19-6.5-29-.7V44Z" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M40 45v19" stroke="#0B0F19" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M40 13c2.2 6.2 4.4 9.2 8.5 12-4.1 2-6.3 5-8.5 10.5-2.2-5.5-4.4-8.5-8.5-10.5 4.1-2.8 6.3-5.8 8.5-12Z" fill="url(#c1b-spark)" filter="url(#c1b-glow)"/>
    <circle cx="53" cy="15" r="2.5" fill="#00F2FE"/>
