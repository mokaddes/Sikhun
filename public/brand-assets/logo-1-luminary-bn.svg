  <!-- BANGLA WORDMARK: শিখুন -->
  <g transform="translate(94, 0)">
    <text x="0" y="47" font-family="'Hind Siliguri', 'Kalpurush', 'SolaimanLipi', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">
      শিখুন<tspan fill="#F97316">.</tspan><tspan fill="#00F2FE" font-size="28" font-weight="700">কম</tspan>
    </text>
    <rect x="0" y="55" width="180" height="19" rx="4" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-opacity="0.3" stroke-width="1"/>
    <text x="8" y="68" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="11" font-weight="600" fill="#FB923C">
