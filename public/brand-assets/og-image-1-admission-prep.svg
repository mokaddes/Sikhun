<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Ambient Radial Light Cones -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange-glow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="c1-page-cyan" x1="10" y1="30" x2="45" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c1-page-amber" x1="75" y1="30" x2="40" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB24A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Lighting spheres -->
  <rect width="1200" height="630" fill="url(#cyan-glow)"/>
  <rect width="1200" height="630" fill="url(#orange-glow)"/>
  <rect width="1200" height="630" fill="url(#violet-glow)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- TOP HEADER / BRAND BAR -->
  <g transform="translate(80, 55)">
    <!-- Small Logo Icon -->
    <g transform="scale(0.85)">
      <path d="M11 44C19 38 28 39 39 45.5v19.5c-10-6-19-6.5-28-.8V44Z" fill="url(#c1-page-cyan)"/>
      <path d="M69 44C61 38 52 39 41 45.5v19.5c10-6 19-6.5 28-.8V44Z" fill="url(#c1-page-amber)"/>
      <path d="M11 44C19 38 28 39 39 45.5c10-6.5 19-7.5 30-1.5v20.2c-10-6-19-5.5-29 .5-10-6-19-6.5-29-.7V44Z" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M40 13c2.2 6.2 4.4 9.2 8.5 12-4.1 2-6.3 5-8.5 10.5-2.2-5.5-4.4-8.5-8.5-10.5 4.1-2.8 6.3-5.8 8.5-12Z" fill="#F97316"/>
    </g>
    <!-- Brand Title -->
    <text x="75" y="44" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
      Sikhun<tspan fill="#F97316">.com</tspan>
    </text>
    <text x="280" y="44" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="600" fill="#94A3B8">
      | শিখুন
    </text>

    <!-- Top Badge -->
    <rect x="740" y="14" width="280" height="40" rx="20" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="762" cy="34" r="5" fill="#00F2FE"/>
    <text x="778" y="40" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="700" fill="#38BDF8">
      স্মার্ট এআই স্টাডি প্ল্যাটফর্ম
    </text>
  </g>

  <!-- LEFT COLUMN: MAIN HEADLINE & PILLS -->
  <g transform="translate(80, 180)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="235" height="34" rx="8" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.4" stroke-width="1"/>
    <text x="14" y="23" font-family="'Hind Siliguri', sans-serif" font-size="15" font-weight="700" fill="#FB923C">
      ★ ভর্তি ও বিসিএস প্রস্তুতি ২০২৬
    </text>

    <!-- Main Title in Bengali -->
    <text x="0" y="85" font-family="'Hind Siliguri', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" line-height="1.2">
      পড়ুন, পরীক্ষা দিন ও
    </text>
    <text x="0" y="148" font-family="'Hind Siliguri', sans-serif" font-size="52" font-weight="800" fill="#00F2FE">
      AI এক্সপ্লেনারে বুঝুন সহজে!
    </text>

    <!-- Subtitle / Meta Description Snippet -->
    <text x="0" y="200" font-family="'Hind Siliguri', sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
      ঢাবি, রাবি, বুয়েট, চবি, গুচ্ছ ও মেডিকেল ভর্তি বিজ্ঞপ্তি,
    </text>
    <text x="0" y="230" font-family="'Hind Siliguri', sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
      বিগত ২০ বছরের প্রশ্নব্যাংক এবং তাৎক্ষণিক সঠিক উত্তর বিশ্লেষণ।
    </text>

    <!-- 4 Feature Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="25" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
        📚 AI বই রিডার
      </text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="150" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="25" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
        ⚡ ২০,০০০+ MCQ
      </text>

      <!-- Pill 3 -->
      <rect x="305" y="0" width="165" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="320" y="25" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
        🎓 সার্কুলার ট্র্যাকার
      </text>

      <!-- Pill 4 -->
      <rect x="480" y="0" width="135" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="495" y="25" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
        🏆 লিডারবোর্ড
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: GLASSMORPHISM CARD SHOWCASE -->
  <g transform="translate(730, 160)">
    <!-- Glowing background plate -->
    <rect x="-10" y="-10" width="390" height="390" rx="32" fill="#00F2FE" opacity="0.1" filter="url(#soft-blur)"/>

    <!-- Main Floating Card -->
    <rect x="0" y="0" width="370" height="370" rx="28" fill="url(#card-grad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Card Header -->
    <g transform="translate(26, 30)">
      <rect x="0" y="0" width="46" height="46" rx="14" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="13" y="32" font-size="22">🎯</text>
      <text x="60" y="22" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
        লাইভ মডেল টেস্ট
      </text>
      <text x="60" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#38BDF8">
        RU • DU • GST • BCS
      </text>
    </g>

    <!-- Mock MCQ Item -->
    <g transform="translate(26, 105)">
      <rect x="0" y="0" width="318" height="65" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
        প্রশ্ন: 'অর্ধচন্দ্র' বাগধারাটির সঠিক অর্থ কী?
      </text>
      <circle cx="26" cy="46" r="6" fill="#10B981"/>
      <text x="40" y="50" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#10B981">
        সঠিক উত্তর: গলা ধাক্কা দেওয়া
      </text>
    </g>

    <!-- Mock AI Explainer Box -->
    <g transform="translate(26, 185)">
      <rect x="0" y="0" width="318" height="85" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#A5B4FC" letter-spacing="0.5">
        ✨ AI EXPLAINER (শিখুন অ্যাসিস্ট্যান্ট)
      </text>
      <text x="16" y="46" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="500" fill="#C7D2FE">
        'অর্ধচন্দ্র' বলতে চাঁদ কাটার মতো হাত বাঁকিয়ে কাউকে
      </text>
      <text x="16" y="66" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="500" fill="#C7D2FE">
        অপমানজনকভাবে ঘাড় ধরে বের করে দেওয়া বোঝায়।
      </text>
    </g>

    <!-- Card Footer Stats -->
    <g transform="translate(26, 290)">
      <rect x="0" y="0" width="318" height="52" rx="14" fill="#020617" fill-opacity="0.6"/>
      <text x="24" y="32" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">
        শিক্ষার্থী সন্তুষ্টি: <tspan fill="#F59E0B" font-weight="700">৯৯.৪%</tspan>
      </text>
      <rect x="200" y="12" width="100" height="28" rx="8" fill="#F97316"/>
      <text x="218" y="31" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
        ফ্রি শুরু করুন →
      </text>
    </g>
  </g>

  <!-- BOTTOM FOOTER CALLOUT -->
  <g transform="translate(80, 565)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1">
      OFFICIAL PORTAL: <tspan fill="#38BDF8">HTTPS://SIKHUN.COM</tspan>
    </text>
    <text x="730" y="20" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#64748B">
      জ্ঞান ও প্রযুক্তির মেলবন্ধনে বাংলাদেশের আগামী
    </text>
  </g>
</svg>
