<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="c4-grad1" x1="12" y1="12" x2="56" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="c4-grad2" x1="16" y1="36" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="c4-spark" x1="50" y1="8" x2="66" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="c4-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON: The Dynamic 'S' Learning Ribbon -->
  <g transform="translate(6, 6)">
    <circle cx="34" cy="34" r="30" fill="#3B82F6" opacity="0.1" filter="url(#c4-glow)"/>

    <!-- Top Arch of 'S' (Cyan to Blue) -->
    <path d="M48 20C48 14 42 10 33 10C21 10 14 17 14 26C14 36 24 40 34 44L36 45" stroke="url(#c4-grad1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom Arch of 'S' (Amber to Coral) -->
    <path d="M34 44L36 45C46 49 54 53 54 62C54 71 46 76 34 76C23 76 16 71 16 64" stroke="url(#c4-grad2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Kinetic Overlap Highlight -->
    <circle cx="35" cy="44.5" r="3.5" fill="#FFFFFF"/>

    <!-- AI Diamond Spark Top-Right -->
    <path d="M57 9L59 15L65 17L59 19L57 25L55 19L49 17L55 15Z" fill="url(#c4-spark)" filter="url(#c4-glow)"/>
  </g>

  <!-- WORDMARK: SIKHUN -->
  <g transform="translate(94, 0)">
    <text x="0" y="47" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="36" font-weight="900" letter-spacing="-1" fill="#FFFFFF">
      Sikhun<tspan fill="#00F2FE">.</tspan>
    </text>
    <text x="140" y="47" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="22" font-weight="600" fill="#94A3B8">
      ai
    </text>
    <rect x="0" y="55" width="165" height="18" rx="4" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.25" stroke-width="1"/>
    <text x="8" y="67" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#60A5FA" text-transform="uppercase">
      NEXT-GEN LEARNING
    </text>
  </g>
</svg>
